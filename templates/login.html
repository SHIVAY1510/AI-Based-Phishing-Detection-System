<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/static/styles.css">   
</head>
<body  class="class3">
     <nav class="navbar">
            <a href="#home" class="logo">Phishing Detection Url System</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="login">Login</a></li>
                <li><a href="register">Registration</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    <div>
        <form method="POST" action="/login">
        <fieldset><legend><h1>Login Page</h1></legend>
        <label for="email">Email:</label><br>
        <input class="class2" type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label><br>
        <input class="class2" type="password" id="password" name="password" required><br><br>
        <input class="class2" type="submit" value="Login">
        </fieldset>
        </form>
    </div>
    <p id="message"></p>
    <script>
        async function login(){
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const response = await fetch('https://127.0.0.1:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('message').innerHTML = result.message || result.error;
            if (response.status === 200) {
                window.location.href = '/dashboard.html';
            }
        }
    </script> 
</body>
</html>
